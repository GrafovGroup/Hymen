<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc">
<title id="title">Two common hymenal shapes</title><desc id="desc">Simplified schematic of crescent-shaped hymenal tissue along the lower vaginal opening and ring-shaped tissue around the vaginal opening. Neither image represents sexual history or a before-and-after result.</desc>
<rect width="1000" height="880" fill="#fff6f8"/>
<text x="500" y="78" text-anchor="middle" font-family="Georgia,serif" font-size="42" fill="#502b3b">Understanding hymenal tissue</text>
<text x="500" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#795d69">Two common shapes · simplified schematics</text>
<g stroke="#d7a2b6" stroke-width="2" fill="#f7e3eb"><ellipse cx="278" cy="360" rx="167" ry="192"/><ellipse cx="722" cy="360" rx="167" ry="192"/></g>
<ellipse cx="278" cy="345" rx="126" ry="147" fill="#fffafb"/>
<path d="M153 346 C160 450 211 489 278 489 C345 489 396 450 403 346 C419 462 368 536 278 540 C188 536 137 462 153 346Z" fill="#bf6688"/>
<ellipse cx="722" cy="360" rx="140" ry="164" fill="#bf6688"/>
<ellipse cx="722" cy="360" rx="108" ry="128" fill="#fffafb"/>
<g font-family="Arial,sans-serif" font-size="19" fill="#795d69" text-anchor="middle"><text x="278" y="337">Vaginal</text><text x="278" y="364">opening</text><text x="722" y="352">Vaginal</text><text x="722" y="379">opening</text></g>
<g fill="#502b3b" text-anchor="middle"><text x="278" y="598" font-family="Georgia,serif" font-size="29">Crescent-shaped</text><text x="722" y="598" font-family="Georgia,serif" font-size="29">Ring-shaped</text><text x="278" y="632" font-family="Arial,sans-serif" font-size="17">Tissue along the lower edge</text><text x="722" y="632" font-family="Arial,sans-serif" font-size="17">Tissue around the opening</text></g>
<rect x="328" y="683" width="24" height="24" rx="4" fill="#bf6688"/><text x="367" y="702" font-family="Arial,sans-serif" font-size="19" fill="#502b3b">Rose shading = hymenal tissue</text>
<path d="M100 745H900" stroke="#e9cfd9"/>
<text x="500" y="786" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#502b3b">Natural anatomy varies in shape, size and thickness.</text>
<text x="500" y="821" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#795d69">These are not before-and-after images or indicators of sexual history.</text>
</svg>
